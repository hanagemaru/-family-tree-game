name: Family tree checks
on:
  push:
    branches: [main, 'ui/polish-20261108', 'feature/random-horse-ui-20261113', 'feature/horse-sex-drag-preview-20261113', 'feature/streamlined-card-ui-20261114', 'feature/clean-sports-trading-card-20261114', 'feature/horse-quality-hints-autofit-20261114', 'feature/wikipedia-dam-enrichment-20261114', 'feature/horse-pedigree-narabe-launch-20261114']
  pull_request:
    branches: [main, 'feature/random-horse-stage-20261112', 'feature/random-horse-ui-20261113', 'feature/horse-sex-drag-preview-20261113', 'feature/streamlined-card-ui-20261114', 'feature/clean-sports-trading-card-20261114', 'feature/horse-quality-hints-autofit-20261114']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - run: npm run build
      - run: test -s dist/sports-card.css && test -s dist/launch.css && test -s dist/manifest.webmanifest && test -s dist/index.html

  browser-gestures:
    # Run a real browser review only on the feature branch, not on main.
    if: github.ref_name == 'feature/horse-sex-drag-preview-20261113' || github.ref_name == 'feature/streamlined-card-ui-20261114' || github.ref_name == 'feature/clean-sports-trading-card-20261114' || github.ref_name == 'feature/horse-quality-hints-autofit-20261114' || github.ref_name == 'feature/wikipedia-dam-enrichment-20261114' || github.ref_name == 'feature/horse-pedigree-narabe-launch-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/browser-drag-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-drag-mobile
          path: artifacts/browser-drag/*.png
          if-no-files-found: ignore
