name: Family tree checks
on:
  push:
    branches: [main, 'ui/polish-20261108', 'feature/random-horse-ui-20261113', 'feature/horse-sex-drag-preview-20261113']
  pull_request:
    branches: [main, 'feature/random-horse-stage-20261112', 'feature/random-horse-ui-20261113']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm test
      - run: npm run build
