name: Wikidata multi-lineage comparison
on:
  push:
    branches: [research/wider-horse-lines-20261111]
  workflow_dispatch:
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/research_wikidata_lines.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikidata-lineage-audit
          path: artifacts/wikidata-lineage-audit.*
          if-no-files-found: warn
