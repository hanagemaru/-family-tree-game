name: Probe source infobox fields (temporary)
on:
  push:
    branches: ['feature/horse-card-profiles-20261116']
    paths: ['scripts/probe_horse_wikitext.py','.github/workflows/probe-horse-profile-source.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/probe_horse_wikitext.py
