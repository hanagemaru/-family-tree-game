name: Game home visual review (mobile browser)
on:
  push:
    branches: ['feature/game-home-redesign-20261115']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/browser-home-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-home-mobile-chromium-webkit
          path: artifacts/home-preview/*.png
          if-no-files-found: warn
