name: Wikidata horse coverage audit
on:
  push:
    branches: [research/wikidata-horses-20261111]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and measure Wikidata horse pedigree
        run: python3 scripts/research_wikidata_horses.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wikidata-horse-audit
          path: artifacts/wikidata-horse-audit.*
          if-no-files-found: warn
