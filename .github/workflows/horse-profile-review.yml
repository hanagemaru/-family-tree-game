name: Horse profile review (data, UI and mobile)
on:
  push:
    branches: ['feature/horse-card-profiles-20261116', 'feature/horse-legal-links-20261117']
    paths: ['.github/workflows/horse-profile-review.yml','tests/horse-profile.test.js','scripts/browser-horse-profile-smoke.mjs','src/app.js','src/horse-profile.js','horse-profile.css','data/horse-profiles.v1.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All pure, integrated and ranking tests
        run: npm test
      - name: Build complete static game including 872 horse profile records
        run: npm run build
      - name: Verify generated profile JSON is served with the game
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const html=readFileSync('dist/index.html','utf8');
          const app=readFileSync('dist/src/app.js','utf8');
          const data=JSON.parse(readFileSync('dist/data/horse-profiles.v1.json','utf8'));
          assert.equal(Object.keys(data.horses).length,872);
          assert.ok(data.coverage.withProfileFacts>=260);
          assert.ok(html.includes('horse-profile.css'));
          assert.ok(app.includes('showPlacedHorseProfile'));
          assert.ok(app.includes("dialogKind==='horse-profile'"));
          console.log('HORSE_PROFILE_BUNDLE_VERIFIED',data.coverage);
          JS
      - name: Install browsers for iPhone-sized smoke tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Tap, read and close profiles on Chromium and WebKit (375/390px)
        run: node scripts/browser-horse-profile-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: placed-horse-profiles-mobile
          path: artifacts/horse-profiles/*.png
          if-no-files-found: warn
