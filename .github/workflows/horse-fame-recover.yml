name: Recover verified horse-fame snapshot and run difficulty audit
on:
  push:
    branches: ['feature/horse-fame-difficulty-20261115']
    paths: ['.github/workflows/horse-fame-recover.yml']
permissions:
  contents: write
  actions: read
jobs:
  resume-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: horse-fame-and-three-difficulty-benchmark
          run-id: 43612397151
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/source
      - name: Restore verified 872-QID snapshot from previous run
        run: |
          cp artifacts/source/horse-fame-2026-10.v1.json data/horse-fame-2026-10.v1.json
          python3 - <<'PY'
          import json
          d=json.load(open('data/horse-fame-2026-10.v1.json'))
          assert d['coverage']['named']==872, d['coverage']
          assert d['coverage']['observedViews']==815, d['coverage']
          assert d['coverage']['requestErrors']==0, d['coverage']
          print(d['period'],d['coverage'])
          PY
      - name: Commit exact snapshot without overwriting branch changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/horse-fame-2026-10.v1.json
          git commit -m 'data: freeze 2025-11 to 2026-10 horse fame evidence'
          git fetch origin feature/horse-fame-difficulty-20261115
          git rebase origin/feature/horse-fame-difficulty-20261115
          git push origin HEAD:feature/horse-fame-difficulty-20261115
      - name: Benchmark 1000 questions for EACH level
        run: |
          node scripts/benchmark-horse-difficulty.mjs \
            --runs=1000 --attempts=96 \
            --fame=data/horse-fame-2026-10.v1.json \
            --output=artifacts/horse-difficulty-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horse-difficulty-recovered-benchmark
          path: artifacts/horse-difficulty-benchmark.json
          if-no-files-found: warn
