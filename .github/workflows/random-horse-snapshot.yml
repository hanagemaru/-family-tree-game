name: Random horse snapshot and replay audit
on:
  push:
    branches: ['feature/random-horse-stage-20261112']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate fixed Wikidata snapshot without network
        run: |
          python3 scripts/build_horse_snapshot.py \
            --horse-audit data/source/horse-audit-2026-11-11.json \
            --lineage-audit data/source/lineage-audit-2026-11-11.json \
            --enriched-input data/source/wikidata-live-entities-2026-11-12.json \
            --output artifacts/horse-pedigree-verified.v1.json \
            --audit-output artifacts/horse-data-verified-audit.json
          cmp data/horse-pedigree.v1.json artifacts/horse-pedigree-verified.v1.json
          cmp docs/horse-data-audit-2026-11-12.json artifacts/horse-data-verified-audit.json
      - name: Test original and generated game logic
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          npm test
          npm run build
      - name: Benchmark 1000 distinct seeds using real game core and diagram
        run: node scripts/benchmark-horse-stages.mjs --runs=1000 --attempts=24 --data=data/horse-pedigree.v1.json --output=artifacts/horse-benchmark-verified.json
      - name: Bundle source and logs for reproducible diagnosis
        if: always()
        run: tar -czf artifacts/checked-source.tgz src scripts tests data package.json README.md index.html style.css favicon.svg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: random-horse-snapshot-and-benchmark
          path: artifacts/
          if-no-files-found: warn
