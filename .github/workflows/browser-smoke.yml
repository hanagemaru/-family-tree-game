name: Browser viewport smoke
on:
  workflow_dispatch:
  push:
    branches: [ui/polish-20261108]
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/browser-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-screenshots
          path: artifacts/
