name: Wikimedia source accessibility probe
on:
  push:
    branches:
      - feature/wikipedia-dam-enrichment-20261114
  workflow_dispatch:
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_wikimedia.py
